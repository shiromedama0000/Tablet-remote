name: TabletRemote
options:
  bundleIdPrefix: com.claude.tabletremote
  deploymentTarget:
    iOS: "14.0"
schemes:
  TabletRemote:
    build:
      targets:
        TabletRemote: all
    run:
      config: Release
targets:
  TabletRemote:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: リモコン
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "タブレットをBluetoothのリモコンとして操作するために使用します。"
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claude.tabletremote
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
